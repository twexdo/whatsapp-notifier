services:
  whatsapp-notifier:
    build:
      context: .
      dockerfile: Containerfile
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - "${JOURNAL_DIR:-/var/log/journal}:${JOURNAL_DIR:-/var/log/journal}:ro"
      - /etc/machine-id:/etc/machine-id:ro
    userns_mode: keep-id
    group_add:
      - keep-groups
    security_opt:
      - label=disable
    restart: unless-stopped